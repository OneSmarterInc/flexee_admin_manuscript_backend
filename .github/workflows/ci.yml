name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  django-checks:
    runs-on: ubuntu-latest
    env:
      AI_PROVIDER: mock
      DJANGO_SECRET_KEY: test
      ADMIN_SESSION_SECRET: testsecret
      ADMIN_TOTP_SECRET: JBSWY3DPEHPK3PXP
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m pip_audit -r requirements.txt --strict --progress-spinner off
      - run: python manage.py check
      # A name used but never defined or imported only fails when that line runs (a missing import in an
      # except clause turned every "not found" into a 500). Fail the build on it; unused imports are fine.
      - run: python -m pyflakes review config > pyflakes.txt || true; ! grep -E "undefined name|referenced before assignment" pyflakes.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest -q tests
