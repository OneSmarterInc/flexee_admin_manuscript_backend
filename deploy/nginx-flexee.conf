# Replace manuscript.example.com before installing.
# This same-origin layout serves the built React frontend and proxies /api/ to Gunicorn.

server {
    listen 80;
    listen [::]:80;
    server_name manuscript.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name manuscript.example.com;

    # Replace with your certificate paths (for example Certbot-managed files).
    ssl_certificate /etc/letsencrypt/live/manuscript.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/manuscript.example.com/privkey.pem;

    client_max_body_size 25m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
    }

    # Private manuscript media is never publicly exposed.
    location /__private_media__/ {
        return 404;
    }

    root /var/www/flexee/flexee_admin_manuscript_frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
